<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas em html5</title>
</head>
<body>
    <h1>tabelas em html 5</h1>
    <table border="3">
        <thead>
            <tr>
                <th>nome do aluno/</th>
                <th> disciplina/</th>
                <th> nota final</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>joao gabriel</td>
                <td>fisica</td>
                <td>7,4</td>
            </tr>

            <tr>
                <td>luiz</td>
                <td>quimica</td>
                <td>9.0</td>
            </tr>
                <td>dodo</td>
                <td>filosofia</td>
                <td>10</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2"><strong>media da turma</strong></td>
                <td><strong>8,8</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
